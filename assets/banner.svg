<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="3840" height="1080" viewBox="0 0 3840 1080" role="img" aria-labelledby="t d">
<title id="t">Python Files and Errors Assessment banner</title>
<desc id="d">Animated banner for the Python files and errors assessment: Expense Tracker and Attendance Cleaner.</desc>
<style>
text{white-space:pre}
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
.m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Courier New',monospace}
.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:36 26;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-62}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.62}}
.orb{animation:orb 8s ease-in-out infinite}
@keyframes orb{0%,100%{opacity:.14}50%{opacity:.30}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040714"/><stop offset=".55" stop-color="#0b1236"/><stop offset="1" stop-color="#1a0f3d"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="10s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7aa2ff" stroke-opacity=".07" stroke-width="2"/></pattern>
<filter id="blur" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="140"/></filter>
<marker id="arr-cyan" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#22d3ee"/></marker><marker id="arr-violet" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#a78bfa"/></marker><marker id="arr-green" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#34d399"/></marker><marker id="arr-amber" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#fbbf24"/></marker><marker id="arr-rose" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#fb7185"/></marker><marker id="arr-blue" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#60a5fa"/></marker><marker id="arr-pink" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#f472b6"/></marker><linearGradient id="tint-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/></linearGradient><linearGradient id="tint-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/></linearGradient><linearGradient id="tint-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity=".04"/></linearGradient><linearGradient id="tint-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".30"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".04"/></linearGradient><linearGradient id="tint-rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity=".30"/><stop offset="1" stop-color="#fb7185" stop-opacity=".04"/></linearGradient><linearGradient id="tint-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".30"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".04"/></linearGradient><linearGradient id="tint-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".30"/><stop offset="1" stop-color="#f472b6" stop-opacity=".04"/></linearGradient>
</defs>
<rect width="3840" height="1080" fill="url(#bg)"/><rect width="3840" height="1080" fill="url(#grid)"/><circle class="orb" cx="3302" cy="194" r="620" fill="#22d3ee" filter="url(#blur2)"/><circle class="orb" cx="384" cy="994" r="700" fill="#a78bfa" filter="url(#blur2)" style="animation-delay:-4s"/>
<g class="float" style="animation-delay:0s" opacity=".16"><text x="2380" y="140" font-size="120" fill="#22d3ee" class="m" text-anchor="start" font-weight="700">try:</text></g><g class="float" style="animation-delay:-2s" opacity=".16"><text x="3040" y="1010" font-size="110" fill="#fb7185" class="m" text-anchor="start" font-weight="700">except</text></g><g class="float" style="animation-delay:-4s" opacity=".16"><text x="1650" y="990" font-size="120" fill="#fbbf24" class="m" text-anchor="start" font-weight="700">set()</text></g><g class="float" style="animation-delay:-1s" opacity=".16"><text x="120" y="1000" font-size="130" fill="#34d399" class="m" text-anchor="start" font-weight="700">.csv</text></g><g class="float" style="animation-delay:-3s" opacity=".16"><text x="2150" y="1000" font-size="100" fill="#a78bfa" class="m" text-anchor="start" font-weight="700">strip()</text></g><g class="float" style="animation-delay:-5s" opacity=".16"><text x="3300" y="110" font-size="100" fill="#f472b6" class="m" text-anchor="start" font-weight="700">title()</text></g><g class="float" style="animation-delay:-6s" opacity=".16"><text x="1990" y="600" font-size="70" fill="#60a5fa" class="m" text-anchor="start" font-weight="700">[ ... for ... ]</text></g><g class="enter"><rect x="200" y="170" width="1008.84" height="84" rx="42" fill="#22d3ee"/><text x="704.4200000000001" y="227" font-size="38" fill="#06102a" class="m" text-anchor="middle" font-weight="700">PYTHON  ·  FILE HANDLING  ·  EXCEPTIONS</text></g><g class="enter" style="animation-delay:.15s"><text x="200" y="470" font-size="200" fill="url(#tg)" class="s" text-anchor="start" font-weight="700">Python Files</text><text x="200" y="675" font-size="200" fill="url(#tg)" class="s" text-anchor="start" font-weight="700">&amp; Errors Assessment</text></g><g class="enter" style="animation-delay:.3s"><text x="200" y="790" font-size="76" fill="#c7d4ff" class="s" text-anchor="start">Expense Tracker  +  Attendance Cleaner</text></g><g class="enter" style="animation-delay:0.40s"><rect x="200" y="850" width="155.56" height="92" rx="46.0" fill="#34d399"/><text x="277.78" y="912.1" font-size="46" fill="#06102a" class="m" text-anchor="middle" font-weight="700">CSV</text></g><g class="enter" style="animation-delay:0.52s"><rect x="391.56" y="850" width="412.24" height="92" rx="46.0" fill="#fb7185"/><text x="597.6800000000001" y="912.1" font-size="46" fill="#06102a" class="m" text-anchor="middle" font-weight="700">try / except</text></g><g class="enter" style="animation-delay:0.64s"><rect x="839.8" y="850" width="212.6" height="92" rx="46.0" fill="#fbbf24"/><text x="946.0999999999999" y="912.1" font-size="46" fill="#06102a" class="m" text-anchor="middle" font-weight="700">set()</text></g><g class="enter" style="animation-delay:0.76s"><rect x="1088.3999999999999" y="850" width="440.76" height="92" rx="46.0" fill="#a78bfa"/><text x="1308.7799999999997" y="912.1" font-size="46" fill="#06102a" class="m" text-anchor="middle" font-weight="700">comprehension</text></g><g class="enter" style="animation-delay:0.88s"><rect x="1565.1599999999999" y="850" width="298.15999999999997" height="92" rx="46.0" fill="#60a5fa"/><text x="1714.2399999999998" y="912.1" font-size="46" fill="#06102a" class="m" text-anchor="middle" font-weight="700">sorted()</text></g><g class="enter" style="animation-delay:.3s"><rect class="pulse" x="2640" y="170" width="1060" height="760" rx="44" fill="#22d3ee" filter="url(#blur)"/><rect x="2640" y="170" width="1060" height="760" rx="44" fill="#070c22" stroke="#22d3ee" stroke-width="6"/><path d="M2640 260 V214 A44 44 0 0 1 2684 170 H3656 A44 44 0 0 1 3700 214 V260 Z" fill="#111b45"/><circle cx="2700" cy="215" r="16" fill="#fb7185"/><circle cx="2750" cy="215" r="16" fill="#fbbf24"/><circle cx="2800" cy="215" r="16" fill="#34d399"/><text x="3230.0" y="228" font-size="34" fill="#8da2dc" class="m" text-anchor="middle">expense_tracker.py</text></g><g class="enter" style="animation-delay:0.90s"><text x="2690" y="360" font-size="40" fill="#34d399" class="m" text-anchor="start">$ python expense_tracker.py</text></g><g class="enter" style="animation-delay:1.45s"><text x="2690" y="442" font-size="40" fill="#c7d4ff" class="m" text-anchor="start">expenses.csv not found.</text></g><g class="enter" style="animation-delay:2.00s"><text x="2690" y="524" font-size="40" fill="#c7d4ff" class="m" text-anchor="start">Starting with an empty list.</text></g><g class="enter" style="animation-delay:2.55s"><text x="2690" y="606" font-size="40" fill="#ffffff" class="m" text-anchor="start">Amount: abc</text></g><g class="enter" style="animation-delay:3.10s"><text x="2690" y="688" font-size="40" fill="#fb7185" class="m" text-anchor="start">Invalid amount. Please enter a number</text></g><g class="enter" style="animation-delay:3.65s"><text x="2690" y="770" font-size="40" fill="#ffffff" class="m" text-anchor="start">Amount: 250.5</text></g><g class="enter" style="animation-delay:4.20s"><text x="2690" y="852" font-size="40" fill="#34d399" class="m" text-anchor="start">Expense added and saved.</text></g><g class="enter" style="animation-delay:4.75s"><text x="2690" y="934" font-size="40" fill="#34d399" class="m" text-anchor="start">$</text><rect class="blink" x="2732" y="900" width="22" height="44" fill="#22d3ee"/></g><rect y="1064" width="3840" height="16" fill="url(#bar)"/></svg>
