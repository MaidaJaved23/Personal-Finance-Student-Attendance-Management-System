nchor="start">expenses.csv missing on first run</text><text x="210" y="1120" font-size="34" fill="#fb7185" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="210" y="1180" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">start with an empty list</text></g><g class="enter" style="animation-delay:0.35s"><rect class="pulse" x="1370" y="500" width="1100" height="720" rx="50" fill="#fbbf24" filter="url(#blur)"/><rect x="1370" y="500" width="1100" height="720" rx="50" fill="#0a1230" stroke="#fbbf24" stroke-width="6"/><rect x="1370" y="500" width="1100" height="720" rx="50" fill="url(#tint-amber)"/><polygon points="1480,570 1545,685 1415,685" fill="#fbbf24"/><text x="1480" y="668" font-size="64" fill="#06102a" class="m" text-anchor="middle" font-weight="700">!</text><text x="1590" y="650" font-size="56" fill="#ffffff" class="m" text-anchor="start" font-weight="700">ValueError  (amount)</text><path d="M1420 735 H2420" stroke="#fbbf24" stroke-opacity=".5" stroke-width="4"/><text x="1430" y="818" font-size="34" fill="#fbbf24" class="m" text-anchor="start" font-weight="700">WHERE</text><text x="1430" y="878" font-size="44" fill="#e6edff" class="m" text-anchor="start">ask_amount()</text><text x="1430" y="970" font-size="34" fill="#fbbf24" class="m" text-anchor="start" font-weight="700">PROBLEM</text><text x="1430" y="1030" font-size="40" fill="#e6edff" class="s" text-anchor="start">float("abc") fails; also 0, -5, nan</text><text x="1430" y="1120" font-size="34" fill="#fbbf24" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="1430" y="1180" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">message, then ask again</text></g><g class="enter" style="animation-delay:0.50s"><rect class="pulse" x="2590" y="500" width="1100" height="720" rx="50" fill="#22d3ee" filter="url(#blur)"/><rect x="2590" y="500" width="1100" height="720" rx="50" fill="#0a1230" stroke="#22d3ee" stroke-width="6"/><rect x="2590" y="500" width="1100" height="720" rx="50" fill="url(#tint-cyan)"/><polygon points="2700,570 2765,685 2635,685" fill="#22d3ee"/><text x="2700" y="668" font-size="64" fill="#06102a" class="m" text-anchor="middle" font-weight="700">!</text><text x="2810" y="650" font-size="56" fill="#ffffff" class="m" text-anchor="start" font-weight="700">ValueError  (date)</text><path d="M2640 735 H3640" stroke="#22d3ee" stroke-opacity=".5" stroke-width="4"/><text x="2650" y="818" font-size="34" fill="#22d3ee" class="m" text-anchor="start" font-weight="700">WHERE</text><text x="2650" y="878" font-size="44" fill="#e6edff" class="m" text-anchor="start">ask_date()</text><text x="2650" y="970" font-size="34" fill="#22d3ee" class="m" text-anchor="start" font-weight="700">PROBLEM</text><text x="2650" y="1030" font-size="40" fill="#e6edff" class="s" text-anchor="start">wrong date such as 2026-13-45</text><text x="2650" y="1120" font-size="34" fill="#22d3ee" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="2650" y="1180" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">reject it, ask again</text></g><g class="enter" style="animation-delay:0.65s"><rect class="pulse" x="150" y="1290" width="1100" height="720" rx="50" fill="#a78bfa" filter="url(#blur)"/><rect x="150" y="1290" width="1100" height="720" rx="50" fill="#0a1230" stroke="#a78bfa" stroke-width="6"/><rect x="150" y="1290" width="1100" height="720" rx="50" fill="url(#tint-violet)"/><polygon points="260,1360 325,1475 195,1475" fill="#a78bfa"/><text x="260" y="1458" font-size="64" fill="#06102a" class="m" text-anchor="middle" font-weight="700">!</text><text x="370" y="1440" font-size="56" fill="#ffffff" class="m" text-anchor="start" font-weight="700">Damaged CSV row</text><path d="M200 1525 H1200" stroke="#a78bfa" stroke-opacity=".5" stroke-width="4"/><text x="210" y="1608" font-size="34" fill="#a78bfa" class="m" text-anchor="start" font-weight="700">WHERE</text><text x="210" y="1668" font-size="44" fill="#e6edff" class="m" text-anchor="start">load_expenses()</text><text x="210" y="1760" font-size="34" fill="#a78bfa" class="m" text-anchor="start" font-weight="700">PROBLEM</text><text x="210" y="1820" font-size="40" fill="#e6edff" class="s" text-anchor="start">ValueError or KeyError on a row</text><text x="210" y="1910" font-size="34" fill="#a78bfa" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="210" y="1970" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">skip the row, load the rest</text></g><g class="enter" style="animation-delay:0.80s"><rect class="pulse" x="1370" y="1290" width="1100" height="720" rx="50" fill="#f472b6" filter="url(#blur)"/><rect x="1370" y="1290" width="1100" height="720" rx="50" fill="#0a1230" stroke="#f472b6" stroke-width="6"/><rect x="1370" y="1290" width="1100" height="720" rx="50" fill="url(#tint-pink)"/><polygon points="1480,1360 1545,1475 1415,1475" fill="#f472b6"/><text x="1480" y="1458" font-size="64" fill="#06102a" class="m" text-anchor="middle" font-weight="700">!</text><text x="1590" y="1440" font-size="56" fill="#ffffff" class="m" text-anchor="start" font-weight="700">EOFError / Ctrl+C</text><path d="M1420 1525 H2420" stroke="#f472b6" stroke-opacity=".5" stroke-width="4"/><text x="1430" y="1608" font-size="34" fill="#f472b6" class="m" text-anchor="start" font-weight="700">WHERE</text><text x="1430" y="1668" font-size="44" fill="#e6edff" class="m" text-anchor="start">expense_tracker.py (end)</text><text x="1430" y="1760" font-size="34" fill="#f472b6" class="m" text-anchor="start" font-weight="700">PROBLEM</text><text x="1430" y="1820" font-size="40" fill="#e6edff" class="s" text-anchor="start">input closed or program interrupted</text><text x="1430" y="1910" font-size="34" fill="#f472b6" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="1430" y="1970" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">exit politely, no traceback</text></g><g class="enter" style="animation-delay:0.95s"><rect class="pulse" x="2590" y="1290" width="1100" height="720" rx="50" fill="#60a5fa" filter="url(#blur)"/><rect x="2590" y="1290" width="1100" height="720" rx="50" fill="#0a1230" stroke="#60a5fa" stroke-width="6"/><rect x="2590" y="1290" width="1100" height="720" rx="50" fill="url(#tint-blue)"/><polygon points="2700,1360 2765,1475 2635,1475" fill="#60a5fa"/><text x="2700" y="1458" font-size="64" fill="#06102a" class="m" text-anchor="middle" font-weight="700">!</text><text x="2810" y="1440" font-size="56" fill="#ffffff" class="m" text-anchor="start" font-weight="700">FileNotFoundError</text><path d="M2640 1525 H3640" stroke="#60a5fa" stroke-opacity=".5" stroke-width="4"/><text x="2650" y="1608" font-size="34" fill="#60a5fa" class="m" text-anchor="start" font-weight="700">WHERE</text><text x="2650" y="1668" font-size="44" fill="#e6edff" class="m" text-anchor="start">attendance_cleaner.py</text><text x="2650" y="1760" font-size="34" fill="#60a5fa" class="m" text-anchor="start" font-weight="700">PROBLEM</text><text x="2650" y="1820" font-size="40" fill="#e6edff" class="s" text-anchor="start">attendance.txt is missing</text><text x="2650" y="1910" font-size="34" fill="#60a5fa" class="m" text-anchor="start" font-weight="700">HANDLED BY</text><text x="2650" y="1970" font-size="44" fill="#ffffff" class="s" text-anchor="start" font-weight="700">clear message, no crash</text></g><rect y="2144" width="3840" height="16" fill="url(#bar)"/><text x="140" y="2108" font-size="38" fill="#6f82b8" class="s" text-anchor="start">python-files-errors-assessment  ·  try / except</text></svg>
