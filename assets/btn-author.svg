<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f08a5d"/></marker><linearGradient id="bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="bd" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="260" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ffffff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;520 0" dur="3.2s" repeatCount="indefinite"/></linearGradient><clipPath id="cp"><rect x="4" y="4" width="512" height="112" rx="56"/></clipPath><style>@keyframes dash{to{stroke-dashoffset:-24}}.flow{stroke-dasharray:12 12;animation:dash 1.2s linear infinite}
